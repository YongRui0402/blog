{{- /* 分享。判準與 comments.html 相同:`.Section` 非空 ——
       about.md 與 latest.md 在 content/ 根目錄,Section 是空字串,
       所以自動排除。(只判斷 .IsPage 不夠,那兩頁一樣走 single.html。)

       只有「複製連結」與手機的原生分享,不掛任何第三方按鈕 ——
       那些多半夾帶追蹤腳本,而本站不引入外部資源。

       兩顆按鈕都需要 JS。沒有 JS 時整段不顯示比較誠實,
       所以預設 hidden,由 share.js 打開。 */ -}}
{{- if .Section }}
<section class="share" data-url="{{ .Permalink }}" data-title="{{ .Title }}" hidden>
  <p class="share-t">覺得有用?</p>
  <div class="share-btns">
    <button class="share-native" type="button" hidden>分享</button>
    <button class="share-copy" type="button">複製連結</button>
  </div>
</section>
{{- end }}
