<header class="site-head">
  <div class="wrap head-inner">
    <a class="brand" href="{{ "/" | relURL }}">
      <span class="brand-name">{{ .Site.Title }}</span>
      <span class="brand-sub">{{ .Site.Params.description }}</span>
    </a>
    <nav class="nav" aria-label="主選單">
      {{- range .Site.Menus.main }}
      {{- $active := or ($.IsMenuCurrent "main" .) ($.HasMenuCurrent "main" .) }}
      <a href="{{ .URL | relURL }}"{{ if $active }} class="active" aria-current="page"{{ end }}>{{ .Name }}</a>
      {{- end }}
    </nav>
  </div>
</header>
