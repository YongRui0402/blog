{{ define "main" }}
<header class="list-head">
  <h1>{{ .Title }}</h1>
</header>

<form class="search-form" role="search" onsubmit="return false;">
  <label class="sr-only" for="q">搜尋文章</label>
  <input type="search" id="q" name="q" autocomplete="off" autocapitalize="off"
         spellcheck="false" placeholder="關鍵字…（標題、標籤與內文都會搜）">
</form>

<p id="search-status" class="muted" aria-live="polite"></p>
<ul id="results" class="entries"></ul>

<noscript>
  <p class="muted">搜尋需要 JavaScript。你也可以直接瀏覽
    <a href="{{ "/pitfalls/" | relURL }}">踩坑</a>、
    <a href="{{ "/decisions/" | relURL }}">架構決策</a>、
    <a href="{{ "/projects/" | relURL }}">專案</a>、
    <a href="{{ "/notes/" | relURL }}">速查</a>。</p>
</noscript>
{{ end }}

{{ define "scripts" }}
{{- $js := resources.Get "js/search.js" | minify | fingerprint }}
<script src="{{ $js.RelPermalink }}" integrity="{{ $js.Data.Integrity }}" defer></script>
{{ end }}
