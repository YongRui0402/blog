baseURL = "https://blog.xn--ht0a.tw/"
# v0.158 起 languageCode 改名為 locale
locale = "zh-Hant-TW"
defaultContentLanguage = "zh-tw"
title = "BDGG"
enableRobotsTXT = true
enableGitInfo = false

# 摘要長度（中文字元，列表頁用）
summaryLength = 60

# 內網 staging 建置時用 --baseURL 與 --buildDrafts 覆蓋；實際指令見 Makefile
# 的 `staging` target。（這個檔會同步到公開 repo，所以不在這裡寫內網主機名。）
# 公開建置不加 --buildDrafts，draft: true 的文章不會被產出。

[params]
  # tagline 出現在每頁標頭與首頁；description 給 meta / RSS / og。
  # 兩者都描述「這裡有什麼內容」，不描述「作者是誰」——
  # 站上不寫職業、不寫任職單位。技能清單只放在關於頁，那是使用者主動點進去看的。
  tagline = "踩過的坑、當時的判斷，與會忘記的指令"
  description = "自架服務、Linux 與開發工具的工作筆記。以實際踩過的問題、當時的判斷依據，以及可重複的解法為主。"
  author = "BDGG"
  # 對外一律 BDGG。不放真名 / 居住地 / 私人信箱 / 職業。
  github = "YongRui0402"
  # 文章頂端「本文寫於 X，現況可能已變」的提示，超過這個月數才顯示
  staleAfterMonths = 12
  # 留言（giscus，走 GitHub Discussions）。三個值都填了才會載入留言區，
  # 而且只在正式建置載入 —— 內網 staging 不該產生真實留言。
  # repoId / categoryId 從 https://giscus.app 產生，是公開識別碼不是機密。
  # 前置作業：到公開 repo 的 Settings 開啟 Discussions。
  [params.giscus]
    repo = "YongRui0402/blog"
    repoId = "R_kgDOT4FnpA"
    category = "Announcements"
    categoryId = "DIC_kwDOT4FnpM4DD44c"

  # 沒在 front matter 指定 cover 時用的預設封面（相對 assets/）。
  # 找不到這個檔就不顯示封面，不會壞。
  defaultCover = "photos/cloud-sea-ridgeline.jpg"

[pagination]
  pagerSize = 10

# 分類即 section，網址就是 /pitfalls/xxx/。
# GA4 才有辦法依類型分開看流量 —— 這是分類進 permalink 的唯一理由。
[permalinks]
  [permalinks.page]
    pitfalls  = "/pitfalls/:slug/"
    decisions = "/decisions/:slug/"
    projects  = "/projects/:slug/"
    notes     = "/notes/:slug/"
    learning  = "/learning/:slug/"
    life      = "/life/:slug/"

[taxonomies]
  tag = "tags"

# 相關文章。主要靠共同標籤，日期只當同分微調 ——
# 「同一個主題」比「同一週寫的」有意義得多。
# threshold 40 是刻意偏高的：寧可一篇都不推，也不要推一篇明顯不相關的。
[related]
  includeNewer = true
  threshold = 40
  toLower = false
  [[related.indices]]
    name = "tags"
    weight = 100
  [[related.indices]]
    name = "date"
    weight = 10

[services]
  [services.googleAnalytics]
    ID = "G-1XSYTQRNTB"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      # 允許 markdown 內嵌 HTML（About 頁的技能標籤要用）
      unsafe = true
    [markup.goldmark.parser]
      [markup.goldmark.parser.attribute]
        block = true
  [markup.highlight]
    # noClasses = false → 產出 class 而非 inline style，才能跟著深色模式切換
    noClasses = false
    lineNos = false
    tabWidth = 4
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

[outputs]
  # JSON 是搜尋索引 /index.json。索引內容由 --buildDrafts 決定，
  # 所以 staging 的索引含草稿、公開站的不含，不需要額外處理。
  home = ["HTML", "RSS", "JSON"]
  section = ["HTML"]

[menu]
  # 踩坑（/pitfalls/）與架構決策（/decisions/）刻意不放進選單 ——
  # 這兩類直接用搜尋頁的分類快選就夠了。頁面本身仍然存在、仍然可以連，
  # 只是不從導覽進去。搜尋頁的 chip 是另一份清單，不受這裡影響。
  [[menu.main]]
    name = "專案"
    url = "/projects/"
    weight = 30
  [[menu.main]]
    name = "速查"
    url = "/notes/"
    weight = 40
  [[menu.main]]
    name = "學習筆記"
    url = "/learning/"
    weight = 41
  [[menu.main]]
    name = "生活紀錄"
    url = "/life/"
    weight = 42
  [[menu.main]]
    name = "最新"
    url = "/latest/"
    weight = 5
  [[menu.main]]
    name = "搜尋"
    url = "/search/"
    weight = 45
  [[menu.main]]
    name = "關於"
    url = "/about/"
    weight = 50
